name: CI

on:
  # Push runs only on main (after a merge). Branches are covered by the pull_request event; triggering on every
  # branch push as well would run the whole firmware matrix twice per commit on a PR branch.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'   # weekly: early warning when WLED main changes under us
  workflow_dispatch:

permissions:
  contents: read

# An explicit `shell: bash` runs steps with `bash -eo pipefail`. The default shell has no pipefail, so a failed
# `pio run | tee build.log` passed and the build failure surfaced as a misleading flash-size error in the next step.
# Third-party actions are pinned to full commit SHAs (version in the comment).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Logic and repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { persist-credentials: false }
      - name: Logic, HTTP head, device list, preset JSON vs ArduinoJson 6.18.1, JD9853 table (ASan + UBSan, -Werror)
        run: tests/run.sh
      - name: Repository checks (config round trip, pins vs docs, pinned WLED commit, scripts)
        run: python3 -I -m unittest discover -s tests -v

  firmware:
    name: Firmware (${{ matrix.name }}, WLED ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The WLED commit this usermod is tested against. Keep in sync with scripts/dev-setup.sh
          # (tests/test_repo.py fails if they differ).
          - { name: default,       label: pinned, ref: fffa05a765d41d7126b66ab5a3d1ce1f41e7d11e, flags: "",                          experimental: false }
          # Code that only exists under a flag still has to compile.
          - { name: debug,         label: pinned, ref: fffa05a765d41d7126b66ab5a3d1ce1f41e7d11e, flags: "-D CTL_DEBUG",               experimental: false }
          - { name: plain-st7789,  label: pinned, ref: fffa05a765d41d7126b66ab5a3d1ce1f41e7d11e, flags: "-D CTL_LCD_PLAIN_ST7789",    experimental: false }
          # WLED main today: an early warning, allowed to fail.
          - { name: default,       label: main,   ref: main,                                      flags: "",                          experimental: true }
    steps:
      # WLED and the usermod are SIBLING directories. A WLED tree inside the usermod directory makes PlatformIO fold
      # WLED's own libs into the usermod and the build fails with "wled_ADCmanager.h: No such file or directory".
      - name: Checkout usermod
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { path: usermod, persist-credentials: false }
      - name: Checkout WLED
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { repository: wled/WLED, ref: "${{ matrix.ref }}", path: WLED, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WLED/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: { python-version: "3.12" }
      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('WLED/platformio.ini', 'usermod/library.json') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio==6.2.0
      - name: Build the web UI (generates headers the firmware includes)
        working-directory: WLED
        run: npm ci && npm run build
      - name: Point the sample build environment at this checkout
        run: sed "s#__USERMOD_PATH__#$GITHUB_WORKSPACE/usermod#g" usermod/platformio_override.sample.ini > WLED/platformio_override.ini
      - name: Build
        working-directory: WLED
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.flags }}
        run: pio run -e ctl_esp32c6_8MB 2>&1 | tee build.log
      - name: Flash use stays under 90% of the app partition
        working-directory: WLED
        run: |
          line=$(grep -E '^Flash:' build.log | tail -1)
          echo "$line"
          pct=$(echo "$line" | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          awk -v p="$pct" 'BEGIN { exit !(p != "" && p+0 <= 90) }' || { echo "flash use ${pct}% exceeds 90%"; exit 1; }
      - name: Keep the firmware image
        if: matrix.name == 'default' && matrix.label == 'pinned'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: firmware-ctl_esp32c6_8MB
          path: WLED/.pio/build/ctl_esp32c6_8MB/firmware.bin
          retention-days: 14
