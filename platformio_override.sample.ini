; Build environment for the Waveshare ESP32-C6-Touch-LCD-1.47 (8 MB flash, ESP32-C6FH8).
; scripts/install.sh generates a combined override (this usermod + LS Formula); this file is the minimal one for
; building just this usermod. Copy it to platformio_override.ini at the top of a WLED checkout (pinned commit in
; scripts/dev-setup.sh) and replace __USERMOD_PATH__ with the path to this repository. The WLED checkout must NOT be
; inside this repository (PlatformIO would fold WLED's own libs into the usermod and the build would fail).
;
; Each custom_usermods entry must be on its own line. ESP32-C6 builds exist only on WLED main (experimental).
;
; Pins (defaults in controller.cpp, override with -D CTL_PIN_*): LCD SCLK 1 / MOSI 2 / CS 14 / DC 15 / RST 22 /
; backlight 23, touch SDA 18 / SCL 19 / RST 20 / INT 21. DATA_PINS is only the default LED pin (7 is the one header
; pin Waveshare documents as free); change it in the WLED UI. BTNPIN=-1 stops WLED claiming GPIO 0 (battery sense).
; Add -D CTL_DEBUG to log touch events on the USB serial port.

[platformio]
default_envs = ctl_esp32c6_8MB

[env:ctl_esp32c6_8MB]
extends = env:esp32c6dev_8MB
custom_usermods =
  ${env:esp32c6dev_8MB.custom_usermods}
  symlink://__USERMOD_PATH__
build_flags = ${env:esp32c6dev_8MB.build_flags}
  -D DATA_PINS=7
  -D BTNPIN=-1
